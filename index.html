<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pegasus Sensor Survey</title><style>html{color-scheme:light}</style></head><body><title>Pegasus Sensor Survey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one question per screen, a fixed progress header, a fixed nav bar; centered column that widens on the 15in kiosk. */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#12262F; --muted:#566B74; --line:#C6D3D8;
  --accent:#026395; --accent-ink:#FFFFFF; --chip:#DCE7EA; --warn:#B8381A; --ok:#2B7549;
  --stbd:#16793F; --stbd-ink:#FFFFFF; --port:#B3261E; --port-ink:#FFFFFF;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A20; --surface:#15262E; --ink:#E6EEF0; --muted:#93A9B1; --line:#2A414B;
  --accent:#55B4E8; --accent-ink:#04202F; --chip:#1E3640; --warn:#F08A6B; --ok:#6CC08F;
  --stbd:#4FCB85; --stbd-ink:#062A16; --port:#FF8479; --port-ink:#3A0A06; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A20; --surface:#15262E; --ink:#E6EEF0; --muted:#93A9B1; --line:#2A414B;
  --accent:#55B4E8; --accent-ink:#04202F; --chip:#1E3640; --warn:#F08A6B; --ok:#6CC08F;
  --stbd:#4FCB85; --stbd-ink:#062A16; --port:#FF8479; --port-ink:#3A0A06; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{min-height:100%;display:flex;flex-direction:column;max-width:880px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{padding-block:14px 10px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--font-display);
  text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
main{flex:1;padding-block:18px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:6px;padding:4px 10px;font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.chip.inst{background:var(--accent);color:var(--accent-ink)}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.08;margin:0;text-wrap:balance}
.hint{color:var(--muted);margin:0;max-width:62ch}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.opt{min-height:64px;padding:12px 18px;border-radius:10px;border:2px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;font-weight:600;font-size:19px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.field{width:100%;min-height:64px;padding:14px 16px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:20px}
textarea.field{min-height:120px;resize:vertical}
.unit{display:flex;align-items:center;gap:12px}.unit span{color:var(--muted);font-weight:600}
.shots{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.shot{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:var(--chip)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:12px}
.btn{min-height:60px;padding:12px 24px;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:19px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.quiet{border-color:var(--line);color:var(--muted);font-weight:600}
.btn[disabled]{opacity:.45;cursor:default}
.note summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
.note textarea{margin-top:8px}
.nav{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;gap:12px;justify-content:space-between;border-top:1px solid var(--line)}
.nav .btn{flex:0 1 auto}
.nav .spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.rev{display:grid;gap:10px}
.rev div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;min-width:0}
.rev b{font-weight:600}.rev span{color:var(--muted);text-align:right}
.rev .miss{color:var(--warn);font-weight:600}
.status{padding:12px 16px;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
.status.ok{border-color:var(--ok)}.status.bad{border-color:var(--warn)}
.big{font-family:var(--font-display);font-size:clamp(36px,8vw,64px);font-weight:700;line-height:1;margin:0;text-wrap:balance}

.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo svg,.logo img{display:block}
.logo img{height:auto}
.logo img.hd{height:40px;width:auto}
img.lg-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) img.lg-l{display:none}:root:not([data-theme="light"]) img.lg-d{display:block}}
:root[data-theme="dark"] img.lg-l{display:none}:root[data-theme="dark"] img.lg-d{display:block}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero img.big-logo{height:88px;width:auto;flex:none}

.wordmark{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.14em;color:var(--accent)}
.brand .tag{flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .count{white-space:nowrap}
@media (max-width:480px){.brand .tag{display:none}.brand .count{margin-left:auto}}
.chip.side-stbd{background:var(--stbd);color:var(--stbd-ink)}
.chip.side-port{background:var(--port);color:var(--port-ink)}
[data-side="stbd"] .bar i{background:var(--stbd)}
[data-side="port"] .bar i{background:var(--port)}
main[data-side="stbd"]{border-left:8px solid var(--stbd);padding-left:14px}
main[data-side="port"]{border-left:8px solid var(--port);padding-left:14px}
.why{border-left:4px solid var(--accent);padding:2px 0 2px 14px;margin:0;max-width:62ch}
.sidebig{display:inline-block;align-self:flex-start;border-radius:8px;padding:6px 14px;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase}
.sidebig.stbd{background:var(--stbd);color:var(--stbd-ink)}
.sidebig.port{background:var(--port);color:var(--port-ink)}
@media (min-width:1000px){body{font-size:20px}.opt{min-height:72px;font-size:22px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div id="app"></div>

<script>
/* ---------- Configuration ----------
   Leave the Supabase values empty to use the built-in preview mode. */
const CONFIG = {
  vessel: "S/V Pegasus",
  formId: "sensor-survey-2026-10",
  supabaseUrl: "",      // set in config.js: https://xxxx.supabase.co
  supabaseKey: "",      // set in config.js: anon (public) key only
  table: "survey_responses",
  bucket: "survey-photos"
};

function loadConfig(){
  return new Promise(res=>{
    try{const s=document.createElement("script");s.src="config.js?"+Date.now();s.onload=s.onerror=()=>res();document.head.appendChild(s);setTimeout(res,2000)}catch(e){res()}
  }).then(()=>{if(window.SURVEY_CONFIG)Object.assign(CONFIG,window.SURVEY_CONFIG)});
}

/* ---------- Form definition ---------- */
const DK = ["Yes","No","Don't know"];
const BILGE_Q=[
        {id:"A1",type:"photo",title:"Photograph the Rule high-water alarm label",hint:"The model number must be readable."},
        {id:"A2",type:"photo",title:"Photograph the alarm's wiring terminals",hint:"One wide shot, then one close-up."},
        {id:"A3",type:"choice",title:"What sounds the alarm?",options:["Buzzer built into the alarm","Separate buzzer","No buzzer","Don't know"]},
        {id:"A4",type:"choice",title:"Does the alarm stay powered with the electronics switch OFF?",hint:"Check the breaker or fuse label if you are not sure.",options:DK},
        {id:"A5",type:"photo",title:"Photograph the bilge pump label",hint:"Make and model readable."},
        {id:"A6",type:"choice",title:"Is there a separate automatic float switch for the pump?",options:DK},
        {id:"A6b",type:"photo",title:"Photograph the pump's float switch",showIf:{id:"A6",equals:"Yes"}},
        {id:"A7",type:"choice",title:"Is there a hand-width of free space within 1 m of the alarm for a small box?",options:DK}
];
const TANK_Q=[
        {id:"B0",type:"choice",title:"Which cabin does this tank serve?",hint:"This names the tank for the rest of the survey.",options:["Fore cabin","Aft cabin"]},
        {id:"B1",type:"choice",title:"What is the tank made of?",options:["Poly","Stainless","Other","Don't know"]},
        {id:"B2",type:"text",title:"Tank capacity",hint:"Only if a label or the manual shows it.",placeholder:"Litres or gallons"},
        {id:"B3",type:"photo",title:"Photograph the top of the tank",hint:"Show every fitting.",skipLabel:"Can't see top",skipValue:"I can't see the top of the tank"},
        {id:"B4",type:"choice",title:"Is there a level sender on this tank?",hint:"A stick, a probe, or wires leaving the tank top.",options:DK},
        {id:"B5",type:"photo",title:"Photograph the sender and its wires",showIf:{id:"B4",equals:"Yes"}},
        {id:"B5b",type:"text",title:"Where do the sender wires go?",showIf:{id:"B4",equals:"Yes"},long:true},
        {id:"B6",type:"photo",title:"Photograph any tank indicator on a panel",hint:"Lights or a gauge. Skip if there is none."},
        {id:"B7",type:"choice",title:"Is there room on the tank top for a probe the size of a pen?",options:DK}
];
const SIDE_INFO={
  stbd:{title:"Starboard side first",hint:"Starboard is the right-hand side when you face the bow. Do everything on this side before you cross the boat: the bilge alarm and pump, then the two waste tanks on this side. The port side comes next."},
  port:{title:"Now the port side",hint:"Port is the left-hand side when you face the bow. Same order as before: the bilge alarm and pump, then the two waste tanks on this side."}
};
const sideSections=(s,word)=>[
  {id:"S",title:word+" side",side:s,questions:[{id:"INFO-"+s,type:"info",title:SIDE_INFO[s].title,hint:SIDE_INFO[s].hint}]},
  {id:"A",title:"Bilge alarms and pumps",side:s,instances:[{key:s,label:word+" bilge"}],questions:BILGE_Q},
  {id:"B",title:"Waste tanks",side:s,tanks:true,instances:[{key:s+"1",label:word+" tank 1"},{key:s+"2",label:word+" tank 2"}],questions:TANK_Q},
  {id:"SC",title:"Waste seacock",side:s,instances:[{key:s,label:word+" seacock"}],questions:[
    {id:"SC1",type:"photo",title:"Photograph the waste seacock on this side",hint:"Both tanks on this side drain through this one valve. Show the valve and the hose attached to it."}]}
];
const FORM = {
  title: "Sensor survey",
  intro: "About an hour. Survey only: please do not change any wiring or switch anything off. Photos matter more than words. Take each photo wide first, then close up. \"Don't know\" is a useful answer.",
  sections: [
    ...sideSections("stbd","Starboard"),
    ...sideSections("port","Port"),
    { id:"C", title:"Core switch (aft starboard cabin closet)",
      questions:[
        {id:"C1",type:"photo",title:"Photograph the core switch",hint:"A wide shot of the closet, then a close-up showing the model label."},
        {id:"C2",type:"number",title:"How many PoE ports are free?",unit:"ports",hint:"The switch has 16. Count the ones with nothing plugged in."},
        {id:"C3",type:"choice",title:"Does the switch stay powered with the electronics switch OFF?",options:DK},
        {id:"C4",type:"choice",title:"Could a cable run from this closet straight up toward the salon overhead?",hint:"Look for a chase, a conduit or a gap behind a panel. Do not pull anything.",options:["Yes, an easy path","Possible but difficult","No","Don't know"]}
      ]},
    { id:"D", title:"Forward hatches",
      questions:[
        {id:"D1",type:"photo",title:"Photograph the always-on 12 V feed near the forward hatches",hint:"The outlet or terminal. Include a forward hatch in the shot if you can."}
      ]},
    { id:"E", title:"Always-on 12 V circuit",
      questions:[
        {id:"E1",type:"photo",title:"Photograph the breaker or switch for the circuit that feeds the Pi, Peplink and Wi-Fi",hint:"The label must be readable."},
        {id:"E2",type:"text",title:"What is the amp rating on that breaker or fuse?",placeholder:"For example 15 A"},
        {id:"E3",type:"choice",title:"Are there spare fuse or terminal positions for two small additions?",hint:"Each under 1 A.",options:DK},
        {id:"E4",type:"text",title:"Anything on this circuit that surprised you?",long:true}
      ]}
  ]
};

/* ---------- State ---------- */
const $app = document.getElementById("app");
let S = null;            // saved state
let steps = [];          // visible steps
let view = "welcome";    // welcome | step | review | done
let submitResult = null;

const newState = () => ({id:"sv-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),tech:"",startedAt:new Date().toISOString(),answers:{},notes:{},photos:{},idx:0});
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* IndexedDB persistence; the page works without it */
const DBNAME="rory-survey";
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function loadSaved(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction("kv").objectStore("kv").get(CONFIG.formId);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
let saveTimer=null;
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{const d=await idb();d.transaction("kv","readwrite").objectStore("kv").put(S,CONFIG.formId)}catch(e){}},250)}
async function clearSaved(){try{const d=await idb();d.transaction("kv","readwrite").objectStore("kv").delete(CONFIG.formId)}catch(e){}}

/* ---------- Steps ---------- */
function allSteps(){
  const out=[];
  for(const sec of FORM.sections){
    const insts=sec.instances||[{key:"",label:""}];
    for(const inst of insts)for(const q of sec.questions)
      out.push({sec,inst,q,id:q.id+(inst.key?"@"+inst.key:"")});
  }
  return out;
}
const ALL=allSteps();
function visible(st){
  const c=st.q.showIf; if(!c) return true;
  const key=c.id+(st.inst.key?"@"+st.inst.key:"");
  return S.answers[key]===c.equals;
}
function refresh(){steps=ALL.filter(visible); if(S.idx>=steps.length)S.idx=Math.max(0,steps.length-1)}
function instLabel(st){
  if(!st.inst.key) return "";
  if(st.sec.tanks){const n=S.answers["B0@"+st.inst.key]; return n&&n!=="__skip"?st.inst.label+": "+n:st.inst.label}
  return st.inst.label;
}
function isDone(st){
  if(st.q.type==="info") return true;
  const a=S.answers[st.id];
  if(st.q.type==="photo") return (S.photos[st.id]||[]).length>0||(a!==undefined&&a!=="");
  return a!==undefined&&a!=="";
}

/* ---------- Photos ---------- */
async function shrink(file){
  let w,h,src;
  try{src=await createImageBitmap(file,{imageOrientation:"from-image"});w=src.width;h=src.height}
  catch(e){src=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}
  const s=Math.min(1,1280/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.8);
}

function logoImg(cls){return `<img class="lg-l ${cls}" src="${LOGO_L}" alt=""><img class="lg-d ${cls}" src="${LOGO_D}" alt="">`}
function logoHTML(){return `<span class="logo">${logoImg("hd")}<span class="wordmark">PEGASUS</span></span>`}
function shell(inner,{pct=0,right="",side=""}={}){
  $app.dataset.side=side;
  $app.innerHTML=`<header class="top"><div class="brand">${logoHTML()}<span class="tag">${esc(FORM.title)}</span><span class="count">${right}</span></div><div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div></header>${inner}`;
}
function render(){
  refresh();
  if(view==="welcome") return renderWelcome();
  if(view==="review") return renderReview();
  if(view==="done") return renderDone();
  renderStep();
}
function renderWelcome(){
  const resumable=S&&Object.keys(S.answers).length+Object.keys(S.photos).length>0&&!S.submitted;
  shell(`<main>
    <div class="hero"><p class="big">Sensor survey</p>${logoImg("big-logo")}</div>
    <p class="why"><b>Why we're doing this.</b> Pegasus is getting sensors that watch the bilges, the waste tanks and the radio coverage on board, so a problem is flagged before a charter guest finds it. Before anything is ordered we need to know exactly what is already fitted and where it is. Your answers decide which parts we buy and where they go.</p>
    <p class="hint">${esc(FORM.intro)}</p>
    <label class="hint" for="tech" style="font-weight:600">Your name</label>
    <input id="tech" class="field" autocomplete="name" placeholder="Name of the person doing the survey" value="${esc(S.tech)}">
    <p class="hint">No camera on this screen? Open this page on your phone and take the photos there.</p>
  </main>
  <div class="nav">${resumable?`<button class="btn quiet" data-act="restart">Start over</button>`:`<span class="spacer"></span>`}
  <button class="btn primary" data-act="begin">${resumable?"Continue":"Start"}</button></div>`);
}
function renderStep(){
  const st=steps[S.idx], q=st.q, id=st.id;
  const il=instLabel(st);
  const side=st.sec.side||"";
  const sideWord=side==="stbd"?"Starboard · green":side==="port"?"Port · red":"";
  const pct=Math.round(S.idx/steps.length*100);
  let body="";
  if(q.type==="choice"){
    body=`<div class="opts" role="group" aria-label="${esc(q.title)}">${q.options.map(o=>`<button class="opt" data-act="pick" data-v="${esc(o)}" aria-pressed="${S.answers[id]===o}">${esc(o)}</button>`).join("")}</div>`;
  }else if(q.type==="text"){
    const v=S.answers[id]&&S.answers[id]!=="__skip"?S.answers[id]:"";
    body=q.long?`<textarea id="inp" class="field" placeholder="${esc(q.placeholder||"")}">${esc(v)}</textarea>`:`<input id="inp" class="field" placeholder="${esc(q.placeholder||"")}" value="${esc(v)}">`;
  }else if(q.type==="number"){
    const v=S.answers[id]&&S.answers[id]!=="__skip"?S.answers[id]:"";
    body=`<div class="unit"><input id="inp" class="field" inputmode="decimal" style="max-width:220px" value="${esc(v)}"><span>${esc(q.unit||"")}</span></div>`;
  }else if(q.type==="info"){
    body=`<span class="sidebig ${side}">${esc(sideWord)}</span>`;
  }else if(q.type==="photo"){
    const ps=S.photos[id]||[];
    body=`<div class="shots">${ps.map((p,i)=>`<div class="shot"><img alt="Photo ${i+1}" src="${p}"><button data-act="rmphoto" data-i="${i}" aria-label="Remove photo ${i+1}">×</button></div>`).join("")}</div>
    <div class="row">
      <button class="btn primary" data-act="shoot">${ps.length?"Add another photo":"Take photo"}</button>
      <button class="btn" data-act="library">Choose from gallery</button>
      ${q.skipLabel?`<button class="btn danger" data-act="skip">${esc(q.skipLabel)}</button>`:""}
    </div>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <input id="lib" type="file" accept="image/*" multiple hidden>`;
  }
  const canSkip=q.type!=="choice"&&q.type!=="info"&&!q.skipLabel;

  const noteOpen=!!S.notes[id];
  shell(`<main data-side="${side}">
    <div class="chips"><span class="chip">${esc(st.sec.title)}</span>${il?`<span class="chip ${side?"side-"+side:"inst"}">${esc(il)}</span>`:""}</div>
    <h1>${esc(q.title)}</h1>
    ${q.hint?`<p class="hint">${esc(q.hint)}</p>`:""}
    ${body}
    ${q.type==="info"?"":`<details class="note" ${noteOpen?"open":""}><summary>Add a note</summary><textarea id="note" class="field" placeholder="Anything worth adding">${esc(S.notes[id]||"")}</textarea></details>`}
  </main>
  <div class="nav">
    <button class="btn quiet" data-act="back" ${S.idx===0?"disabled":""}>Back</button>
    <span class="spacer"></span>
    ${canSkip?`<button class="btn quiet" data-act="skip">${q.type==="photo"?esc(q.skipLabel||"No photo"):"Don't know"}</button>`:""}
    <button class="btn primary" data-act="next">${S.idx===steps.length-1?"Review":"Next"}</button>
  </div>`,{pct,side,right:`${S.idx+1} of ${steps.length}`});
}
function renderReview(){
  const rows=[];
  for(const st of steps){
    if(st.q.type==="info") continue;
    if(st.q.type==="photo"){const n=(S.photos[st.id]||[]).length;const a=S.answers[st.id];rows.push([st,n?`${n} photo${n>1?"s":""}`:(a!==undefined&&a!=="")?(a==="__skip"?"no photo":a):null])}
    else{const a=S.answers[st.id];rows.push([st,a===undefined||a===""?null:a==="__skip"?"don't know":a])}
  }
  const missing=rows.filter(r=>r[1]===null);
  shell(`<main>
    <p class="big">Review</p>
    <p class="hint">${missing.length?`${missing.length} question${missing.length>1?"s":""} not answered yet. You can go back, or submit with those left blank.`:"Everything is answered."}</p>
    <div class="card rev">${rows.map(([st,v],i)=>`<div><b>${st.inst.key?esc(instLabel(st))+" · ":""}${esc(st.q.title)}</b>${v===null?`<span class="miss"><a href="#" data-act="goto" data-i="${steps.indexOf(st)}" style="color:inherit">not answered</a></span>`:`<span>${esc(v)}</span>`}</div>`).join("")}</div>
    ${submitResult?`<div class="status ${submitResult.ok?"ok":"bad"}" role="status">${submitResult.html}</div>`:""}
  </main>
  <div class="nav"><button class="btn quiet" data-act="back">Back</button><span class="spacer"></span>
  <button class="btn primary" data-act="submit" ${S.submitting?"disabled":""}>${S.submitting?"Preparing…":"Send survey"}</button></div>`,{pct:100,right:"Review"});
}
function renderDone(){
  shell(`<main>
    <p class="big">Thank you${S.tech?", "+esc(S.tech.split(" ")[0]):""}.</p>
    ${submitResult?`<div class="status ${submitResult.ok?"ok":"bad"}" role="status">${submitResult.html}</div>`:""}
    ${S.durationMin?`<p class="hint">Time taken: ${S.durationMin} minute${S.durationMin===1?"":"s"}.</p>`:""}
    <p class="hint">In the share sheet, choose Mail (or Messages) and send it to the address in the email you received. You can close this page after that.</p>
  </main><div class="nav"><button class="btn quiet" data-act="restart">Start a new survey</button><span class="spacer"></span></div>`,{pct:100,right:"Done"});
}

/* ---------- Events ---------- */
function saveInputs(){
  const st=steps[S.idx]; if(!st||view!=="step") return;
  const inp=document.getElementById("inp");
  if(inp){const v=inp.value.trim(); if(v) S.answers[st.id]=v; else if(S.answers[st.id]!=="__skip") delete S.answers[st.id]}
  const n=document.getElementById("note"); if(n){const v=n.value.trim(); if(v) S.notes[st.id]=v; else delete S.notes[st.id]}
  persist();
}
function go(i){saveInputs();S.idx=i;persist();render();window.scrollTo(0,0)}
$app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act;
  if(act==="begin"){S.tech=document.getElementById("tech").value.trim();if(!S.begun){S.begun=true;S.startedAt=new Date().toISOString()}view="step";persist();render();return}
  if(act==="restart"){await clearSaved();S=newState();submitResult=null;view="welcome";render();return}
  if(act==="pick"){const st=steps[S.idx];S.answers[st.id]=b.dataset.v;persist();refresh();
    // keep scroll; re-render to update pressed state and any follow-up questions
    saveInputs();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(act==="skip"){const st=steps[S.idx];saveInputs();if(st.q.type==="photo"&&(S.photos[st.id]||[]).length){}else S.answers[st.id]=st.q.skipValue||st.q.skipLabel||"__skip";persist();return advance()}
  if(act==="next"){saveInputs();return advance()}
  if(act==="back"){if(view==="review"){view="step";S.idx=steps.length-1;render();return}return go(Math.max(0,S.idx-1))}
  if(act==="goto"){e.preventDefault();view="step";return go(+b.dataset.i)}
  if(act==="shoot"){document.getElementById("cam").click();return}
  if(act==="library"){document.getElementById("lib").click();return}
  if(act==="rmphoto"){const st=steps[S.idx];S.photos[st.id].splice(+b.dataset.i,1);persist();saveInputs();render();return}
  if(act==="submit"){return doSubmit()}
});
function advance(){refresh();if(S.idx>=steps.length-1){saveInputs();view="review";render();window.scrollTo(0,0)}else go(S.idx+1)}
$app.addEventListener("change",async e=>{
  if(e.target.id!=="cam"&&e.target.id!=="lib") return;
  const st=steps[S.idx]; const files=[...e.target.files]; if(!files.length) return;
  saveInputs();
  const list=S.photos[st.id]=S.photos[st.id]||[];
  for(const f of files){try{list.push(await shrink(f))}catch(err){}}
  delete S.answers[st.id];
  persist();render();
});
$app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.id==="inp"){e.preventDefault();document.querySelector('[data-act="next"]')?.click()}
});

/* ---------- Submit ---------- */
function payload(){
  const answers={};for(const st of ALL){const a=S.answers[st.id];if(a!==undefined)answers[st.id]=a}
  const now=new Date();S.durationMin=Math.max(1,Math.round((now-new Date(S.startedAt))/60000));
  return {id:S.id,formId:CONFIG.formId,vessel:CONFIG.vessel,tech:S.tech,startedAt:S.startedAt,submittedAt:now.toISOString(),durationMin:S.durationMin,answers,notes:S.notes,
    photoCounts:Object.fromEntries(Object.entries(S.photos).map(([k,v])=>[k,v.length]))};
}
async function dataToBlob(u){return (await fetch(u)).blob()}
async function submitSupabase(p){
  const H={apikey:CONFIG.supabaseKey,Authorization:"Bearer "+CONFIG.supabaseKey};
  const paths={};let n=0;
  for(const [k,list] of Object.entries(S.photos)){paths[k]=[];
    for(let i=0;i<list.length;i++){const path=`${S.id}/${k.replace("@","-")}-${i+1}.jpg`;
      const r=await fetch(`${CONFIG.supabaseUrl}/storage/v1/object/${CONFIG.bucket}/${path}`,{method:"POST",headers:{...H,"Content-Type":"image/jpeg"},body:await dataToBlob(list[i])});
      if(!r.ok&&r.status!==409) throw new Error("Photo upload failed ("+r.status+")"); paths[k].push(path);n++}}
  const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/${CONFIG.table}`,{method:"POST",headers:{...H,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({id:S.id,data:{...p,photos:paths}})});
  if(!r.ok&&r.status!==409) throw new Error("Save failed ("+r.status+")");
  return `Sent. ${n} photo${n===1?"":"s"} uploaded.`;
}
async function submitClaude(p){
  const c=window.claude; if(!c||!c.use) return null;
  const db=await c.use("db"); if(!db) return null;
  const assets=await c.use("assets");
  const ids={};let n=0,skipped=0;
  if(assets){for(const [k,list] of Object.entries(S.photos)){ids[k]=[];
    for(const u of list){try{const a=await assets.upload(await dataToBlob(u));ids[k].push(a.id);n++}catch(e){skipped++}}}}
  else skipped=Object.values(S.photos).reduce((t,l)=>t+l.length,0);
  await db.doc("surveys/"+S.id).set({...p,photoAssets:ids});
  return `Sent. ${n} photo${n===1?"":"s"} uploaded${skipped?`, ${skipped} could not be uploaded and stay on this device`:""}.`;
}
function summaryText(p){
  const L=[];L.push(`${CONFIG.vessel} sensor survey`,`Done by: ${p.tech||"(no name)"}`,`Started: ${p.startedAt}`,`Submitted: ${p.submittedAt}`,`Time taken: ${p.durationMin} min`,"");
  for(const st of ALL){
    if(st.q.type==="info"||!visible(st)) continue;
    const a=S.answers[st.id];const n=(S.photos[st.id]||[]).length;
    let v=st.q.type==="photo"?(n?`${n} photo(s)`:(a&&a!=="__skip"?a:a==="__skip"?"no photo":"not answered")):(a===undefined?"not answered":a==="__skip"?"don't know":a);
    L.push(`${st.inst.key?instLabel(st)+" | ":""}${st.q.title}: ${v}`+(S.notes[st.id]?`  [note: ${S.notes[st.id]}]`:""));
  }
  return L.join("\n");
}
async function submitShare(p){
  const files=[new File([summaryText(p)+"\n\n--- raw ---\n"+JSON.stringify(p,null,2)],`survey-${S.id}.txt`,{type:"text/plain"})];
  for(const [k,list] of Object.entries(S.photos)) for(let i=0;i<list.length;i++)
    files.push(new File([await dataToBlob(list[i])],`${k.replace("@","-")}-${i+1}.jpg`,{type:"image/jpeg"}));
  if(navigator.canShare&&navigator.canShare({files})){
    await navigator.share({files,title:`${CONFIG.vessel} sensor survey`,text:`${CONFIG.vessel} sensor survey results (${files.length-1} photos)`});
    return `Shared: ${files.length-1} photo${files.length===2?"":"s"} and the answers.`;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(files[0]);a.download=files[0].name;document.body.appendChild(a);a.click();a.remove();
  throw new Error("This browser cannot share photos. The answers were saved as a file; open this page on your phone to send the photos too.");
}
async function doSubmit(){
  S.submitting=true;submitResult=null;render();
  const p=payload();let msg=null,err=null;
  try{
    if(CONFIG.supabaseUrl&&CONFIG.supabaseKey){
      try{msg=await submitSupabase(p)}
      catch(e){const why=e&&e.message?e.message:"cloud error";msg="The cloud upload failed ("+why+"), so it was sent with the share sheet instead. "+await submitShare(p)}
    }else{msg=await submitClaude(p);if(!msg)msg=await submitShare(p)}
  }catch(e){err=e&&e.name==="AbortError"?"Sharing was cancelled, so nothing was sent.":(e&&e.message?e.message:"Could not send")}
  S.submitting=false;
  if(msg){S.submitted=true;submitResult={ok:true,html:esc(msg)};view="done";persist()}
  else{
    submitResult={ok:false,html:esc(err||"Could not send.")+" Your answers and photos are saved on this device. Tap Submit again to retry."};
  }
  render();
}

/* ---------- Boot ---------- */
(async()=>{
  await loadConfig();
  const saved=await loadSaved();
  S=saved&&!saved.submitted?saved:newState();
  S.submitting=false;
  render();
})();
</script>
</body></html>
