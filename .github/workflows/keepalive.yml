# Keeps the free-tier Supabase project from auto-pausing (it pauses after 7 days
# without activity). Runs a tiny read through the REST API once a day using the
# public anon key already in config.js. Temporary: remove once the survey moves
# into the RORY project.
name: supabase-keepalive

on:
  schedule:
    - cron: "17 12 * * *"   # daily, 12:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=$(grep -o 'eyJ[^"]*' config.js | head -1)
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/survey_responses?select=id&limit=1")
          echo "HTTP $code"; head -c 300 /tmp/body; echo
          # 200 = ok (RLS may return []); 401/403 still reached Postgres.
          case "$code" in 200|401|403) exit 0;; *) exit 1;; esac
